name: Package Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine check-manifest
    
    - name: Check manifest
      run: check-manifest
      continue-on-error: true
    
    - name: Build package
      run: python -m build
    
    - name: Check distribution
      run: twine check dist/*
    
    - name: Install package
      run: pip install dist/*.whl
    
    - name: Test import
      run: |
        python -c "import ml.models.train"
        python -c "import ml.data.datasets"
        python -c "import alveslib"
    
    - name: Validate CLI tools
      run: |
        disgraphi-train --help
        disgraphi-data --help
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.10'
      with:
        name: distribution
        path: dist/

  notebook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install notebook dependencies
      run: |
        pip install nbformat nbconvert jupyter
    
    - name: Validate Colab notebook
      run: |
        python -m nbconvert --to notebook --execute --ExecutePreprocessor.timeout=60 \
          DisgraPhi_Personalization.ipynb --output /tmp/test.ipynb || true
        # Just check notebook is valid JSON
        python -c "import json; json.load(open('DisgraPhi_Personalization.ipynb'))"
        echo "✓ Notebook structure is valid"
