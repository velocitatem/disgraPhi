# Hardware configuration for A100 40GB
# Optimization level: conservative (prioritize speed over memory)

hardware:
  device: cuda
  vram_gb: 40
  optimization: conservative

model:
  quantization: none  # Full precision training
  lora:
    r: 32  # Can afford higher rank
    alpha: 64
    dropout: 0.05

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  bf16: true
  fp16: false

memory:
  use_liger_kernel: false  # Not needed with 40GB
  use_packing: false
  gradient_checkpointing: false  # Trade memory for speed
  activation_offloading: false
  optim: adamw_torch  # Standard optimizer
