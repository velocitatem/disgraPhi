# Personalization training configuration
# Train user-specific adapter on top of bootstrap

training:
  mode: personalize
  dataset: manifest
  sample_ratio: 1.0

  # Bootstrap adapter (required)
  bootstrap_adapter_path: null  # Must be set via CLI or preset

  epochs: 2  # Fewer epochs for small dataset
  learning_rate: 3.0e-4  # Slightly higher for quick adaptation
  weight_decay: 0.01
  warmup_ratio: 0.05  # Shorter warmup
  max_grad_norm: 1.0

  logging_steps: 5
  eval_steps: 50
  save_steps: 100
  save_total_limit: 2

  metric_for_best_model: eval_loss
  greater_is_better: false
  load_best_model_at_end: true

  seed: 2025

dataset:
  augmentation: true  # Important for small datasets
  augmentation_strength: 0.7
  max_samples: 200  # Recommended limit for personalization
